name: Silicon Apps package

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful existing package run for native catalog verification
        required: false
        default: ''
      source_revision:
        description: Exact candidate source commit
        required: false
        default: ''
  push:
    paths:
      - apps.yaml
      - .github/workflows/apps.yml
      - Cargo.toml
      - Cargo.lock
      - crates/cli/**
      - crates/client/**
      - crates/shared/**
      - scripts/package_apps.py
      - scripts/test_apps_package.py

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    if: inputs.candidate_run == ''
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - target: linux-aarch64
            os: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
          - target: macos-x86_64
            os: macos-15-intel
            triple: x86_64-apple-darwin
          - target: macos-aarch64
            os: macos-15
            triple: aarch64-apple-darwin
          - target: windows-x86_64
            os: windows-2022
            triple: x86_64-pc-windows-msvc
            suffix: .exe
          - target: windows-aarch64
            os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
        with:
          targets: ${{ matrix.triple }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Native CLI build and offline runtime tests
        run: |
          cargo build --locked --release -p silicon-browser-cli --target ${{ matrix.triple }}
          cargo test --locked -p silicon-browser-cli --bin browser --target ${{ matrix.triple }}
          cargo test --locked -p silicon-browser-cli --test binary_contracts --target ${{ matrix.triple }} packaged_controller_is_found_beside_the_cli_and_keeps_the_version_pin
      - name: Check out pinned controller for Windows ARM64
        if: matrix.target == 'windows-aarch64'
        uses: actions/checkout@v4
        with:
          repository: vercel-labs/agent-browser
          ref: eb05921bad874cd2a1b4fa5d1149f1ed26576cae
          path: target/controller-source
      - name: Native Windows ARM64 controller build
        if: matrix.target == 'windows-aarch64'
        # browser does not expose the upstream dashboard; its development placeholder is sufficient.
        run: cargo build --locked --release --manifest-path target/controller-source/cli/Cargo.toml --target ${{ matrix.triple }}
      - name: Stage binaries and verify versions and discovery commands natively
        run: |
          controller=()
          if [[ '${{ matrix.target }}' == windows-aarch64 ]]; then
            controller=(--controller target/controller-source/cli/target/${{ matrix.triple }}/release/agent-browser.exe)
          fi
          python scripts/package_apps.py --stage '${{ matrix.target }}' \
            --binary 'target/${{ matrix.triple }}/release/browser${{ matrix.suffix }}' "${controller[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: apps-${{ matrix.target }}
          path: target/apps/targets/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  package:
    if: inputs.candidate_run == ''
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: apps-*
          path: target/apps/artifacts
      - name: Validate and pack all six targets
        id: package
        run: |
          python scripts/test_apps_package.py
          mkdir -p target/apps/targets
          for artifact in target/apps/artifacts/apps-*; do
            mv "$artifact" "target/apps/targets/${artifact##*/apps-}"
          done
          archive=$(python scripts/package_apps.py --standalone-output target/browser-standalone)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "name=${archive##*/}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: browser-standalone
          path: target/browser-standalone/*
          if-no-files-found: error
          retention-days: 14

  catalog-proof:
    if: inputs.candidate_run != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: linux-aarch64 }
          - { runner: macos-15-intel, target: macos-x86_64 }
          - { runner: macos-15, target: macos-aarch64 }
          - { runner: windows-2025, target: windows-x86_64 }
          - { runner: windows-11-arm, target: windows-aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify candidate provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > candidate.json
          python - <<'PYPROOF'
          import json, os
          r=json.load(open('candidate.json'))
          assert r['head_sha']==os.environ['SOURCE_REVISION'] and r['conclusion']=='success'
          assert r['path']=='.github/workflows/apps.yml'
          PYPROOF
      - uses: actions/download-artifact@v4
        with:
          pattern: apps-browser-*.tar.gz
          merge-multiple: true
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
      - name: Execute exact packaged bytes
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          archive=$(find candidate -name "apps-browser-*.tar.gz")
          python scripts/native_catalog_proof.py --app browser --archive "$archive" --target "$TARGET" --source-revision "$SOURCE_REVISION" --candidate-run "$CANDIDATE_RUN" --output "proof/browser-$TARGET.json"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-catalog-proof-${{ matrix.target }}
          path: proof/
          if-no-files-found: error
