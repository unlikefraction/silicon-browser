name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Installer syntax and offline contracts
        run: |
          sh -n scripts/install.sh
          python3 scripts/test_installer.py
          python3 scripts/test_apps_package.py
          python3 scripts/test_backup.py
          python3 scripts/test_account_uuid_backup.py

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Installs the pnpm version pinned in package.json (packageManager: pnpm@10.33.0).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Silicon UI registry files
        # Downloads every locked registry item and fails if an installed file differs.
        run: node frontend/scripts/sync-silicon-ui.mjs --check
      - name: Frontend build
        run: pnpm --dir frontend build
      - name: Frontend contracts
        run: pnpm --dir frontend test
      - name: Frontend end-to-end build
        # The suite mocks the API at the local backend origin, so it needs a build pinned to it.
        env:
          SB_PUBLIC_BACKEND_URL: http://127.0.0.1:8091
        run: pnpm --dir frontend build
      - name: Frontend end-to-end
        # Headless Google Chrome, preinstalled on GitHub's Ubuntu runners.
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: pnpm --dir frontend e2e

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt -p silicon-browser-backend -p silicon-browser-shared -p silicon-browser -p silicon-browser-cli --check
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps
      - name: Publishable shared crate
        run: cargo package -p silicon-browser-shared --no-verify
      - name: Publishable client crate
        # The client depends on the shared crate at the same release version.
        # Full packaging becomes available after publishing shared first.
        run: cargo package -p silicon-browser --list
