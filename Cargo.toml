[workspace]
resolver = "3"
members = [
    "crates/shared",
    "crates/client",
    "crates/cli",
    "crates/backend",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/unlikefraction/silicon-browser"
homepage = "https://browser.teamofsilicons.com"

[workspace.dependencies]
silicon-browser-shared = { path = "crates/shared", version = "0.1.1" }
silicon-browser = { path = "crates/client", version = "0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
url = { version = "2", features = ["serde"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
