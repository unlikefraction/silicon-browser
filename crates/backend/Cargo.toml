[package]
name = "silicon-browser-backend"
description = "The Silicon Browser API server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "silicon-browser-backend"
path = "src/main.rs"

[dependencies]
silicon-browser-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
url.workspace = true
thiserror.workspace = true
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
async-trait = "0.1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "chrono", "uuid", "migrate"] }
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
sha2 = "0.11"
rand = "0.9"
shell-words = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace", "sensitive-headers"] }
http = "1"
silicon-iam-client = { version = "=1.5.0", default-features = false }

tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
hmac = "0.12"
sha2_10 = { package = "sha2", version = "0.10" }
