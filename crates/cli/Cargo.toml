[package]
name = "silicon-browser-cli"
description = "The `sb` command for managed browser sessions and fast web discovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["browser", "automation", "cli", "silicon"]
categories = ["command-line-utilities", "web-programming::http-client"]

[[bin]]
name = "sb"
path = "src/main.rs"

[dependencies]
silicon-browser.workspace = true
silicon-browser-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
rpassword = "7"
dirs = "6"
fs2 = "0.4"
uuid.workspace = true
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
