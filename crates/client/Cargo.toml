[package]
name = "silicon-browser"
description = "Stateless Rust interface for managed Silicon Browser profiles, sessions, search, fetch, recordings, and usage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["browser", "automation", "cli", "agent-browser"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
silicon-browser-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
thiserror.workspace = true
chrono.workspace = true
shell-words = "1"
sha2 = "0.10"
base64 = "0.22"
mime_guess = "2"
uuid.workspace = true
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = "3"
